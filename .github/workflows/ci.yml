### The Complete Mental Model
```
main          ←── release/v0.x.x ←─────────────────────────────┐
  ↓                                                              │
develop  ←── feature/N-name ←── your daily work                 │
         ←── fix/N-name                                         │
         ←── hotfix/name ────────────────────────────────────── ┘
                              (hotfix goes to both main + develop)